[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "screendepresso"
dynamic = ["version"]
description = "Screenshot capture and annotation for Windows, Linux X11 and macOS"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.8,<7",
    "Pillow>=13,<14",
    "python-xlib>=0.33,<1; sys_platform == 'linux'",
    "send2trash>=1.8.3,<3",
    "pyobjc-framework-Quartz>=11,<13; sys_platform == 'darwin'",
    "pyobjc-framework-Cocoa>=11,<13; sys_platform == 'darwin'",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
build = ["pyinstaller>=6.11,<7"]

[project.scripts]
screendepresso = "screendepresso.app:main"

[tool.setuptools.packages.find]
include = ["screendepresso*"]

[tool.setuptools.dynamic]
version = {attr = "screendepresso.__version__"}
