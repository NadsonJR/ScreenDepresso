[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "screendepresso"
dynamic = ["version"]
description = "Screenshot capture and annotation for Linux X11"
requires-python = ">=3.10"
dependencies = ["PySide6>=6.8,<7", "Pillow>=11,<13", "python-xlib>=0.33,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
build = ["pyinstaller>=6.11,<7"]

[project.scripts]
screendepresso = "screendepresso.app:main"

[tool.setuptools.packages.find]
include = ["screendepresso*"]

[tool.setuptools.dynamic]
version = {attr = "screendepresso.__version__"}
