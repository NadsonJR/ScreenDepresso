name: Build installers

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - '.github/workflows/release.yml'
      - 'screendepresso/**'
      - 'packaging/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.23'
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgssapi-krb5-2 libegl1 libgl1 libglib2.0-0t64 libfontconfig1 libdbus-1-3 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0 libxcb-shape0 libxcb-randr0 libxcb-xfixes0 libxcb-sync1 libxcb-xkb1 libxcb-util1
      - name: Install locked dependencies
        run: uv sync --frozen --extra dev --extra build
      - name: Validate tag and run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            test "$GITHUB_REF_NAME" = "v$(uv run --frozen python -c 'from screendepresso import __version__; print(__version__)')"
          fi
          set +e
          uv run --frozen pytest -q --junitxml=linux-tests.xml
          test_exit=$?
          set -e
          if [ "$test_exit" -ne 0 ]; then
            uv run --frozen python packaging/report_tests.py linux-tests.xml Linux
          fi
          exit "$test_exit"
      - name: Build installer and update manifest
        run: uv run --frozen python packaging/build_deb.py
      - name: Install and smoke-test packaged application
        run: |
          sudo apt-get install -y ./dist/screendepresso_*_amd64.deb
          /usr/bin/screendepresso --version
          XDG_DATA_HOME="$RUNNER_TEMP/screendepresso-smoke" /usr/bin/screendepresso --smoke-test
      - uses: actions/upload-artifact@v4
        with:
          name: screendepresso-linux-amd64
          path: |
            dist/*.deb
            dist/update.json
            dist/SHA256SUMS
          if-no-files-found: error

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.23'
      - name: Install locked dependencies
        run: uv sync --frozen --extra dev --extra build
      - name: Validate tag and run Windows tests
        env:
          QT_QPA_PLATFORM: offscreen
        shell: pwsh
        run: |
          $version = uv run --frozen python -c "from screendepresso import __version__; print(__version__)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") { throw 'Version does not match tag' }
          uv run --frozen pytest -q --junitxml=windows-tests.xml
          $testExit = $LASTEXITCODE
          if ($testExit -ne 0) { uv run --frozen python packaging/report_tests.py windows-tests.xml }
          exit $testExit
      - name: Build Windows installer
        run: uv run --frozen python packaging/build_windows.py
      - name: Install and smoke-test Windows application
        shell: pwsh
        run: |
          $installer = Get-ChildItem dist/*_windows_amd64_setup.exe | Select-Object -First 1
          $target = Join-Path $env:RUNNER_TEMP 'screendepresso-installed'
          $process = Start-Process $installer.FullName -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', "/DIR=$target") -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer exited with $($process.ExitCode)" }
          $env:XDG_CONFIG_HOME = Join-Path $env:RUNNER_TEMP 'screendepresso-config'
          $env:XDG_DATA_HOME = Join-Path $env:RUNNER_TEMP 'screendepresso-data'
          $env:SCREENDEPRESSO_TEST_EXE = Join-Path $target 'screendepresso.exe'
          uv run --frozen python -c "import os, subprocess; subprocess.run([os.environ['SCREENDEPRESSO_TEST_EXE'], '--smoke-test'], check=True, timeout=30)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $upgrade = Start-Process $installer.FullName -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', '/NORESTARTAPPLICATIONS', '/SCREENDEPRESSO_RESTART=1', "/DIR=$target") -PassThru
          if (-not $upgrade.WaitForExit(60000)) { $upgrade.Kill(); throw 'Upgrade installer timed out' }
          if ($upgrade.ExitCode -ne 0) { throw "Upgrade installer exited with $($upgrade.ExitCode)" }
          $deadline = (Get-Date).AddSeconds(20)
          $restarted = @()
          do {
            $restarted = @(Get-Process -Name screendepresso -ErrorAction SilentlyContinue | Where-Object { $_.Path -eq $env:SCREENDEPRESSO_TEST_EXE })
            if ($restarted.Count -gt 0) { break }
            Start-Sleep -Milliseconds 200
          } while ((Get-Date) -lt $deadline)
          if ($restarted.Count -ne 1) { throw 'The update installer did not restart exactly one application instance' }
          Start-Sleep -Seconds 1
          $restarted[0].Refresh()
          if ($restarted[0].HasExited) { throw 'The restarted application exited unexpectedly' }
          $restarted | Stop-Process -Force
      - uses: actions/upload-artifact@v4
        with:
          name: screendepresso-windows-amd64
          path: |
            dist/*_windows_amd64_setup.exe
            dist/windows-update.json
            dist/WINDOWS-SHA256SUMS
          if-no-files-found: error

  publish:
    needs: [build, windows]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: screendepresso-linux-amd64
          path: dist/linux
      - uses: actions/download-artifact@v4
        with:
          name: screendepresso-windows-amd64
          path: dist/windows
      - name: Verify installers and merge update metadata
        run: python packaging/merge_release.py dist/linux dist/windows dist/release
      - name: Publish Linux and Windows installers
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/linux/*.deb dist/windows/*_setup.exe dist/release/update.json dist/release/SHA256SUMS --repo "$GH_REPO" --verify-tag --title "ScreenDepresso $GITHUB_REF_NAME" --notes-file packaging/RELEASE_NOTES.md
